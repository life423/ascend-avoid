<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ascend Avoid — Multiplayer Creature Arena</title>
        <meta name="description" content="Grow your creature, steal gems, escape captures and launch steerable cannonballs in Ascend Avoid, a free real-time multiplayer browser arena." />
        <meta name="theme-color" content="#0a192f" />
        <script>try { if (localStorage.getItem('ascend.barHidden') === '1') document.documentElement.classList.add('bar-start-hidden'); } catch {}</script>
        <link rel="stylesheet" href="styles/index.css" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    </head>

    <body class="online-mode">
        <div class="loader"></div>

        <div class="app-root">
            <header class="app-header">
                <h1>Ascend Avoid</h1>

                <div class="score-panel">
                    <p class="score-label">
                        High Score:
                        <span class="score-value high-score">0</span>
                    </p>
                    <p class="score-label">
                        Score:
                        <span class="score-value current-score">0</span>
                    </p>
                    <!-- Solo stays in the code but off the page: everyone plays online (index.ts setupModeSwitch still wires this up, hidden) -->
                    <div class="mode-switch" role="group" aria-label="Game mode" hidden>
                        <button type="button" class="mode-option" data-mode="singlePlayer" aria-pressed="false">Solo</button>
                        <button type="button" class="mode-option active" data-mode="multiplayer" aria-pressed="true">Online</button>
                    </div>
                </div>
                <form class="bar-name"><label for="player-name">Name</label><input id="player-name" class="bar-name-input" type="text" maxlength="20" aria-label="Your name" /><button type="submit" class="name-save-button">Save name</button><span class="name-status sr-only" role="status"></span></form>
                <div class="bar-actions"><button type="button" class="bar-button bar-help" data-action="help">☰ <span>Help & settings</span><kbd>H</kbd></button><button type="button" class="bar-button bar-view" data-action="hide">⌃ <span>Focus view</span></button></div>
            </header>

            <main class="game-main">
                <div class="game-canvas-container">
                    <div class="canvas-frame">
                        <canvas
                            class="game-canvas"
                            aria-label="Ascend Avoid game"
                            role="img"
                        ></canvas>
                    </div>

                    <aside class="info-panel desktop-only">
                    <div class="panel-content"><h2>How to Play</h2><div class="game-instructions"></div></div>
                    <div class="info-actions">
                        <button
                            class="nav-button btn-action guide-btn-desktop"
                            aria-label="How to play"
                        >
                            Guide
                        </button>
                    </div>
                    </aside>
                </div>
                
                <div class="touch-controls-area mobile-only">
                    <!-- Touch controls will be dynamically inserted here -->
                </div>
            </main>

            <div class="float-menu mobile-only">
                <div class="float-trigger">
                    <span class="menu-dot"></span>
                    <span class="menu-dot"></span>
                    <span class="menu-dot"></span>
                </div>
                <div class="float-options hidden">
                    <button
                        class="btn-action guide-btn-mobile"
                        aria-label="How to play"
                        title="How to play"
                    >
                        Guide
                    </button>
                </div>
            </div>

            <div class="modal-panel mobile-only modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>How to Play</h3>
                        <button
                            class="close-modal"
                            aria-label="Close instructions"
                        >
                            ×
                        </button>
                    </div>
                    <div class="modal-body">
                        <div class="modal-instructions game-instructions"></div>
                    </div>
                </div>
            </div>
        </div>

        <script
            type="module"
            src="index.ts"
        ></script>
    </body>
</html>
