<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Ascend Avoid — Multiplayer Creature Arena</title>
        <meta name="description" content="Grow your creature, steal gems, escape captures and launch living cannonballs in Ascend Avoid, a free real-time multiplayer browser arena." />
        <meta name="theme-color" content="#0a192f" />
        <script>try { if (localStorage.getItem('ascend.barHidden') === '1') document.documentElement.classList.add('bar-start-hidden'); } catch {}</script>
        <link rel="stylesheet" href="styles/index.css" />
        <link rel="icon" href="/favicon.ico?v=v12" sizes="16x16 32x32 48x48" />
        <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=v12" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=v12" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=v12" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=v12" />
    </head>

    <body class="online-mode">
        <div class="loader"></div>

        <div class="app-root">
            <header class="app-header">
                <h1>Ascend Avoid</h1>

                <div class="score-panel">
                    <p class="score-label">
                        High Score:
                        <span class="score-value high-score">0</span>
                    </p>
                    <p class="score-label">
                        Score:
                        <span class="score-value current-score">0</span>
                    </p>
                    <!-- Solo stays in the code but off the page: everyone plays online (index.ts setupModeSwitch still wires this up, hidden) -->
                    <div class="mode-switch" role="group" aria-label="Game mode" hidden>
                        <button type="button" class="mode-option" data-mode="singlePlayer" aria-pressed="false">Solo</button>
                        <button type="button" class="mode-option active" data-mode="multiplayer" aria-pressed="true">Online</button>
                    </div>
                </div>
                <form class="bar-name"><label for="player-name">Name</label><input id="player-name" class="bar-name-input" type="text" maxlength="20" aria-label="Your name" /><button type="submit" class="name-save-button">Save name</button><span class="name-status sr-only" role="status"></span></form>
                <div class="bar-actions"><button type="button" role="switch" class="bar-button bar-mouse" data-action="mouse" aria-label="Mouse control" aria-checked="true">Mouse <span>On</span></button><button type="button" class="bar-button bar-help" data-action="help">☰ <span>Help & settings</span><kbd>H</kbd></button><button type="button" class="bar-button bar-view" data-action="hide">⌃ <span>Focus view</span></button></div>
            </header>

            <main class="game-main">
                <div class="game-canvas-container">
                    <div class="canvas-frame">
                        <canvas
                            class="game-canvas"
                            aria-label="Ascend Avoid game"
                            role="img"
                        ></canvas>
                    </div>

                </div>
                
                <div class="touch-controls-area mobile-only">
                    <!-- Touch controls will be dynamically inserted here -->
                </div>
            </main>

        </div>

        <script
            type="module"
            src="index.ts"
        ></script>
    </body>
</html>
