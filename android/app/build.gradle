import groovy.json.JsonSlurper
import groovy.json.JsonOutput

plugins {
    id 'com.android.application'
}

def targetName = providers.gradleProperty('ascendTarget').getOrElse('production')
def targets = new JsonSlurper().parse(rootProject.file('targets.json'))
def target = targets[targetName]
if (!(targetName in ['production', 'test']) || !target) throw new GradleException('Unknown Ascend Avoid target')
if (targetName == 'test' && (target.packageId == targets.production.packageId || target.origin == targets.production.origin)) throw new GradleException('Test target must be isolated')
def trustedOrigins = [target.origin] + (target.additionalTrustedOrigins ?: [])
def otherTarget = targets[targetName == 'test' ? 'production' : 'test']
def otherOrigins = [otherTarget.origin] + (otherTarget.additionalTrustedOrigins ?: [])
trustedOrigins.each { origin ->
    def uri = new URI(origin)
    if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment ||
            (uri.path && uri.path != '/') || uri.port != -1 || origin != "https://${uri.host}") {
        throw new GradleException('Trusted origins must be exact HTTPS origins without paths')
    }
}
if (trustedOrigins.toSet().size() != trustedOrigins.size() || trustedOrigins.any { otherOrigins.contains(it) }) throw new GradleException('App trusted origins must be unique and isolated')
if (!(target.versionCode instanceof Number) || target.versionCode < 1 || !(target.versionName ==~ /\d+\.\d+\.\d+/)) throw new GradleException('Invalid Android target version')
android {
    compileSdkVersion 36
    buildToolsVersion '36.1.0'
    namespace "io.drewclark.ascendavoid"
    sourceSets {
        main {
            res.srcDir targetName == 'test' ? 'src/testApp/res' : 'src/production/res'
        }
    }
    defaultConfig {
        applicationId target.packageId
        minSdkVersion 24
        targetSdkVersion 36
        versionCode(target.versionCode as int)
        versionName target.versionName
        manifestPlaceholders = [
            ascendLauncherIcon: targetName == 'test' ? '@mipmap/ic_launcher_test' : '@mipmap/ic_launcher_production',
            ascendLauncherRoundIcon: targetName == 'test' ? '@mipmap/ic_launcher_test_round' : '@mipmap/ic_launcher_production_round'
        ]

        resValue "string", "appName", target.name
        resValue "string", "launchUrl", target.origin + '/'
        resValue "string", "hostName", new URI(target.origin).host
        resValue "string", "webManifestUrl", target.origin + '/manifest.webmanifest'
        resValue "string", "assetStatements", JsonOutput.toJson(trustedOrigins.collect { origin ->
            [relation: ['delegate_permission/common.handle_all_urls'], target: [namespace: 'web', site: origin]]
        }).replace('"', '\\"')
    }
    signingConfigs {
        upload {
            def keyPath = System.getenv('ASCEND_ANDROID_KEYSTORE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('ASCEND_ANDROID_STORE_PASSWORD')
                keyAlias 'ascend-avoid-upload'
                keyPassword System.getenv('ASCEND_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            if (System.getenv('ASCEND_ANDROID_KEYSTORE')) signingConfig signingConfigs.upload
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
