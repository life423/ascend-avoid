name: CI

# Every pull request: types, lint, synced schema, production build, unit and multiplayer regressions.
# Device/browser checks run locally with npm run test:browsers.
on:
  pull_request:

jobs:
  build-and-test:
    # CI Build and Test is the check branch protection requires
    name: CI Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd server && npm ci

    - name: Run type checking
      run: |
        npm run type-check
        cd server && npm run type-check

    - name: Lint
      run: npm run lint

    - name: Synced types match the server schema
      run: node scripts/gen-synced-types.mjs --check

    - name: Build application
      run: npm run build

    - name: Physics and gameplay regressions
      run: npm run test:unit

    - name: Isolated multiplayer scenarios
      run: node scripts/multiplayer-smoke.mjs
