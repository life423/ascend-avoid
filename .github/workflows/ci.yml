name: CI

# Every branch other than main, and every pull request: the same build and tests as a deploy, no deploying
on:
  push:
    branches-ignore: [ main ]
  pull_request:

jobs:
  build-and-test:
    # Unique across workflows: this is the check branch protection requires on pull requests
    name: CI Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        cd server && npm ci
    
    - name: Run type checking
      run: |
        npm run type-check
        cd server && npm run type-check
    
    - name: Lint
      run: npm run lint

    - name: Synced types match the server schema
      run: node scripts/gen-synced-types.mjs --check

    - name: Build application
      run: npm run build
    
    - name: Verify build outputs
      run: |
        echo "Checking client build..."
        ls -la dist/
        echo "Checking server build..."
        ls -la server/dist/

    - name: Run the multiplayer smoke test
      # The built server plus scripted players checking every game rule
      timeout-minutes: 10
      run: npm test

    - name: Install browsers for the browser and device tests
      run: npx playwright install --with-deps chromium webkit firefox

    - name: Browser and device tests against this branch's build
      # This branch's own production build, served locally, so the check covers the code being
      # merged rather than whatever is live
      timeout-minutes: 10
      run: |
        NODE_ENV=production PORT=3300 node server/dist/index.js > /tmp/e2e-server.log 2>&1 &
        for i in $(seq 1 50); do curl -sf http://localhost:3300/health > /dev/null && break; sleep 0.2; done
        curl -sf http://localhost:3300/health > /dev/null || { cat /tmp/e2e-server.log; exit 1; }
        E2E_URL=http://localhost:3300 npx playwright test
