name: CI

# Every pull request: types, lint, synced schema, production build, unit and multiplayer regressions.
# Browser jobs cover all three engines and desktop, phone, landscape and tablet layouts.
on:
  pull_request:

jobs:
  build-and-test:
    name: Build and gameplay checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd server && npm ci

    - name: Run type checking
      run: |
        npm run type-check
        cd server && npm run type-check

    - name: Lint
      run: npm run lint

    - name: Synced types match the server schema
      run: node scripts/gen-synced-types.mjs --check

    - name: Build application
      run: npm run build

    - name: Physics and gameplay regressions
      run: npm run test:unit

    - name: Isolated multiplayer scenarios
      run: node scripts/multiplayer-smoke.mjs

  browsers:
    name: Browser regressions (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The matching image already contains browsers and Linux libraries; avoid slow apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: '*Chrome*'
          - browser: firefox
            projects: '*Firefox*'
          - browser: webkit
            projects: '*Safari*'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: |
        npm ci
        cd server && npm ci
    - name: Verify bundled browser runtime
      run: |
        node -e "const fs=require('fs'); const p=require('playwright'); const version=require('@playwright/test/package.json').version; if(version!=='1.64.1') throw new Error('Update the CI image to match Playwright '+version); for(const name of ['chromium','firefox','webkit']) { const path=p[name].executablePath(); if(!fs.existsSync(path)) throw new Error('Missing bundled '+name); console.log(name+' runtime ready'); }"
    - name: Build application
      run: npm run build
    - name: Cross-browser gameplay, touch and render regressions
      env:
        CI: '1'
        E2E_START_SERVER: '1'
        E2E_TEST_HOOKS: '1'
        E2E_URL: http://127.0.0.1:3002
      run: |
        # GitHub mounts a pwuser-owned home but runs this trusted test container as root.
        # Firefox requires the existing home directory to belong to the launch user.
        chown "$(id -u):$(id -g)" "$HOME"
        npx playwright test --project='${{ matrix.projects }}' --retries=0
    - name: Save failure traces, screenshots and performance samples
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-results-${{ matrix.browser }}
        path: test-results/
        retention-days: 7

  required-checks:
    # Preserve the required check name so browser failures block merging too.
    name: CI Build and Test
    if: always()
    needs: [build-and-test, browsers]
    runs-on: ubuntu-latest
    steps:
    - name: Require gameplay and every browser engine to pass
      run: |
        if [[ '${{ needs.build-and-test.result }}' != 'success' || '${{ needs.browsers.result }}' != 'success' ]]; then
          echo 'Gameplay or browser regressions failed.'
          exit 1
        fi
