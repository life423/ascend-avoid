name: CI

# Every pull request: build, gameplay regressions, and desktop and Android Firefox checks.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and gameplay checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd server && npm ci

    - name: Run type checking
      run: |
        npm run type-check
        cd server && npm run type-check

    - name: Lint
      run: npm run lint

    - name: Synced types match the server schema
      run: node scripts/gen-synced-types.mjs --check

    - name: Build application
      run: npm run build

    - name: Physics and gameplay regressions
      run: npm run test:unit

    - name: Isolated multiplayer scenarios
      run: node scripts/multiplayer-smoke.mjs

  firefox-desktop:
    # The broader Chromium and WebKit matrix remains deferred.
    name: Firefox desktop smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The matching image already contains browsers and Linux libraries; avoid slow apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: |
        npm ci
        cd server && npm ci
    - name: Verify bundled Firefox runtime
      run: |
        node -e "const { existsSync } = require('node:fs'); const { firefox } = require('playwright'); const { version } = require('@playwright/test/package.json'); if (version !== '1.64.1') throw new Error('Update the CI image to match Playwright ' + version); if (!existsSync(firefox.executablePath())) throw new Error('Missing bundled Firefox');"
    - name: Build application
      run: npm run build
    - name: Firefox gameplay and renderer checks
      env:
        CI: '1'
        E2E_START_SERVER: '1'
        E2E_TEST_HOOKS: '1'
        E2E_URL: http://127.0.0.1:3002
      run: |
        # GitHub mounts a pwuser-owned home but runs this trusted test container as root.
        # Firefox requires the existing home directory to belong to the launch user.
        chown "$(id -u):$(id -g)" "$HOME"
        npx playwright test \
          tests/e2e/game.spec.mjs tests/e2e/join-modal.spec.mjs \
          tests/e2e/render-performance.spec.mjs tests/e2e/renderer-culling.spec.mjs \
          --project='Firefox (desktop)' --retries=0
    - name: Save failure traces, screenshots and performance samples
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-results-firefox-desktop
        path: test-results/
        retention-days: 7

  firefox-android:
    uses: ./.github/workflows/firefox-android.yml

  required-checks:
    # Preserve the branch protection check name.
    name: CI Build and Test
    if: always()
    needs: [build-and-test, firefox-desktop, firefox-android]
    runs-on: ubuntu-latest
    steps:
    - name: Require gameplay and both Firefox checks
      run: |
        if [[ '${{ needs.build-and-test.result }}' != 'success' ||
              '${{ needs.firefox-desktop.result }}' != 'success' ||
              '${{ needs.firefox-android.result }}' != 'success' ]]; then
          echo 'Gameplay, desktop Firefox, or Android Firefox checks failed.'
          exit 1
        fi
