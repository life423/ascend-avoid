name: CI

# Pull requests and main: gameplay/browser checks, then Android wrapper validation when needed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and gameplay checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        cd server && npm ci

    - name: Android release safety checks
      run: node --test tests/android-release.test.mjs

    - name: Run type checking
      run: |
        npm run type-check
        cd server && npm run type-check

    - name: Lint
      run: npm run lint

    - name: Synced types match the server schema
      run: node scripts/gen-synced-types.mjs --check

    - name: Build application
      run: npm run build

    - name: Physics and gameplay regressions
      run: npm run test:unit

    - name: Isolated multiplayer scenarios
      run: node scripts/multiplayer-smoke.mjs

  firefox-desktop:
    # The broader Chromium and WebKit matrix remains deferred.
    name: Firefox desktop smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The matching image already contains browsers and Linux libraries; avoid slow apt mirrors.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: |
        npm ci
        cd server && npm ci
    - name: Verify bundled Firefox runtime
      run: |
        node -e "const { existsSync } = require('node:fs'); const { firefox } = require('playwright'); const { version } = require('@playwright/test/package.json'); if (version !== '1.64.1') throw new Error('Update the CI image to match Playwright ' + version); if (!existsSync(firefox.executablePath())) throw new Error('Missing bundled Firefox');"
    - name: Build application
      run: npm run build
    - name: Firefox gameplay and renderer checks
      env:
        CI: '1'
        E2E_START_SERVER: '1'
        E2E_TEST_HOOKS: '1'
        E2E_URL: http://127.0.0.1:3002
      run: |
        # GitHub mounts a pwuser-owned home but runs this trusted test container as root.
        # Firefox requires the existing home directory to belong to the launch user.
        chown "$(id -u):$(id -g)" "$HOME"
        npx playwright test \
          tests/e2e/game.spec.mjs tests/e2e/join-modal.spec.mjs \
          tests/e2e/render-performance.spec.mjs tests/e2e/renderer-culling.spec.mjs \
          --project='Firefox (desktop)' --retries=0
    - name: Save failure traces, screenshots and performance samples
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-results-firefox-desktop
        path: test-results/
        retention-days: 7

  firefox-android:
    uses: ./.github/workflows/firefox-android.yml

  required-checks:
    # Preserve the branch protection check name.
    name: CI Build and Test
    if: always()
    needs: [build-and-test, firefox-desktop, firefox-android]
    runs-on: ubuntu-latest
    steps:
    - name: Require gameplay and both Firefox checks
      run: |
        if [[ '${{ needs.build-and-test.result }}' != 'success' ||
              '${{ needs.firefox-desktop.result }}' != 'success' ||
              '${{ needs.firefox-android.result }}' != 'success' ]]; then
          echo 'Gameplay, desktop Firefox, or Android Firefox checks failed.'
          exit 1
        fi

  android-wrapper:
    name: Android wrapper validation
    needs: required-checks
    if: github.repository == 'life423/ascend-avoid'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Detect Android changes on pull requests
        id: scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          paths=$(git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA" -- android/ 'scripts/android-*' tests/android-release.test.mjs .github/workflows/)
          if [[ -n "$paths" ]]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        if: github.event_name == 'push' || steps.scope.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - name: Prepare pinned Android package versions and validate unsigned bundle
        if: github.event_name == 'push' || steps.scope.outputs.android == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Use the same checked Android command-line tools archive as the existing Firefox CI.
          tools_url='https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip'
          curl --fail --silent --show-error --location "$tools_url" --output "$RUNNER_TEMP/android-commandline-tools.zip"
          tools_sha=4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583
          printf '%s  %s\n' "$tools_sha" "$RUNNER_TEMP/android-commandline-tools.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/android-commandline-tools.zip" -d "$RUNNER_TEMP/android-commandline-tools"
          sdkmanager="$RUNNER_TEMP/android-commandline-tools/cmdline-tools/bin/sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.1.0'
          curl --fail --silent --show-error --location \
            'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' \
            --output "$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          pwsh -NoProfile -File scripts/android-build.ps1 -Configuration Release -CiAab \
            -Bundletool "$RUNNER_TEMP/bundletool-all-1.18.3.jar" -OutputDirectory "$RUNNER_TEMP/android-unsigned"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: android-unsigned-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/android-unsigned/
          if-no-files-found: error
          retention-days: 14
