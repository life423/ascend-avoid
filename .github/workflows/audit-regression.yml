name: Audit branch regression verification

on:
  push:
    branches:
      - audit/safe-legacy-cleanup-20261024

jobs:
  regression:
    name: Regression (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, cleanup]
    steps:
      - name: Checkout revision
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && 'e4466f529d60c41b5c4500e66a2d7b26a0e7b048' || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci
      - name: Unit and multiplayer regression suites
        run: npm test
      - name: Build production application
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run browser and mobile tests against this revision
        env:
          E2E_URL: http://127.0.0.1:3000
        run: |
          NODE_ENV=production PORT=3000 npm run start:prod > /tmp/ascend-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health
          npm run test:browsers
      - name: Preserve server logs on failure
        if: failure()
        run: cat /tmp/ascend-server.log 2>/dev/null || true
